<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="444" viewBox="0 0 1000 444" role="img" aria-labelledby="F05A-t" data-figure="F05A"><title id="F05A-t">5  Slab, beam and column overlaps: gross to net</title><style>:root{--surface:#fcfcfb;--card:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--rule:#cfcdc4;--plan:#6f6d66;--plan2:#aeaca4;--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--neutral:#c2c0b7;--slab:#e7e5dd;--s1:#2a78d6;--s2:#eb6834}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#1a1a19;--card:#232321;--ink:#f1f0eb;--ink2:#c4c2ba;--muted:#8f8d86;--grid:#353431;--rule:#4a4945;--plan:#a7a59d;--plan2:#6b6963;--neutral:#6a6863;--slab:#34332f;--s1:#3987e5;--s2:#d95926}}
:root[data-theme="dark"]{--surface:#1a1a19;--card:#232321;--ink:#f1f0eb;--ink2:#c4c2ba;--muted:#8f8d86;--grid:#353431;--rule:#4a4945;--plan:#a7a59d;--plan2:#6b6963;--neutral:#6a6863;--slab:#34332f;--s1:#3987e5;--s2:#d95926}
.t{font-family:system-ui,Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--ink);font-size:10.5px}.tt{font-size:15px;font-weight:650}.ts{font-size:11.5px;fill:var(--ink2)}.t2{fill:var(--ink2)}.tm{fill:var(--muted)}.tb{font-weight:650}.tx{font-size:9.5px}.tl{font-size:12.5px}.th{font-size:22px;font-weight:650}.ax{stroke:var(--grid);stroke-width:1;fill:none}.rule{stroke:var(--rule);stroke-width:1;fill:none}.pl{stroke:var(--plan);stroke-width:.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.pl2{stroke:var(--plan2);stroke-width:.55;fill:none;stroke-dasharray:3 2}.plb{stroke:var(--ink2);stroke-width:1;fill:none}.gl{stroke:var(--grid);stroke-width:.8;stroke-dasharray:2 3}.dim{stroke:var(--ink2);stroke-width:.8;fill:none}.lead{stroke:var(--ink2);stroke-width:.7;fill:none}.slab{fill:var(--slab);stroke:var(--plan);stroke-width:.8}.void{fill:none;stroke:var(--plan2);stroke-width:.6;stroke-dasharray:2 2}.col{fill:var(--neutral);stroke:var(--ink2);stroke-width:.5}.ring{stroke:var(--surface);stroke-width:1.5}.mm{fill:none;stroke:var(--serious);stroke-width:1.6;stroke-dasharray:2.5 1.5}.hl{stroke:var(--crit);stroke-width:.8}.band{fill:var(--crit);fill-opacity:.18;stroke:var(--crit);stroke-width:1.2}.callout{fill:none;stroke:var(--crit);stroke-width:1.2}.s1{fill:var(--s1)}.s2{fill:var(--s2)}.k1{stroke:var(--s1)}.k2{stroke:var(--s2)}.surf{fill:var(--surface)}.card{fill:var(--card);stroke:var(--rule);stroke-width:1}.bdg{fill:none;stroke:var(--ink2);stroke-width:1}.bdg-SCHEMATIC{stroke-dasharray:3 2}.bdg-CONDITIONAL{stroke:var(--warn);fill:var(--warn);fill-opacity:.16}.tex{fill:none;stroke:var(--ink);stroke-opacity:.45;stroke-width:.8}.f-REL{fill:var(--good)}.a-REL{fill:var(--good);fill-opacity:.26;stroke:var(--good);stroke-width:.8}.k-REL{stroke:var(--good)}.f-COND{fill:var(--warn)}.a-COND{fill:var(--warn);fill-opacity:.26;stroke:var(--warn);stroke-width:.8}.k-COND{stroke:var(--warn)}.f-CONF{fill:var(--serious)}.a-CONF{fill:var(--serious);fill-opacity:.26;stroke:var(--serious);stroke-width:.8}.k-CONF{stroke:var(--serious)}.f-BLK{fill:var(--crit)}.a-BLK{fill:var(--crit);fill-opacity:.26;stroke:var(--crit);stroke-width:.8}.k-BLK{stroke:var(--crit)}.f-OWN{fill:var(--neutral)}.a-OWN{fill:var(--neutral);fill-opacity:.26;stroke:var(--neutral);stroke-width:.8}.k-OWN{stroke:var(--neutral)}</style><defs><symbol id="i-REL" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5.5" style="fill:var(--good)"/><path d="M3.3 6.2 5.2 8.1 8.8 4.3" style="fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"/></symbol><symbol id="i-COND" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" style="fill:var(--surface);stroke:var(--warn);stroke-width:1.6"/><path d="M6 1A5 5 0 0 0 6 11Z" style="fill:var(--warn)"/></symbol><symbol id="i-CONF" viewBox="0 0 12 12"><path d="M6 .8 11.4 10.8H.6Z" style="fill:var(--serious)"/><path d="M6 4.3v3.3" style="stroke:#fff;stroke-width:1.5;stroke-linecap:round"/><circle cx="6" cy="9.2" r=".8" style="fill:#fff"/></symbol><symbol id="i-BLK" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5.5" style="fill:var(--crit)"/><path d="M3.9 3.9 8.1 8.1M8.1 3.9 3.9 8.1" style="stroke:#fff;stroke-width:1.6;stroke-linecap:round"/></symbol><symbol id="i-OWN" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" style="fill:none;stroke:var(--ink2);stroke-width:1.3"/><path d="M3.6 6h4.8" style="stroke:var(--ink2);stroke-width:1.5;stroke-linecap:round"/></symbol><pattern id="F05A-tex" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" class="tex"/></pattern></defs><rect width="1000" height="444" style="fill:var(--surface)"/><text class="t tt" x="16" y="25">5  Slab, beam and column overlaps: gross to net</text><text class="t ts" x="16" y="43">S9 measures panels between member faces, beams clear between supports and columns over the full storey; the checks are S9A&#x27;s.</text><g data-label="SCHEMATIC"><rect class="bdg bdg-SCHEMATIC" x="910.4" y="12" width="73.6" height="18" rx="9"/><text class="t tx tb" x="947.2" y="24.5" text-anchor="middle">SCHEMATIC</text></g><rect class="card" x="16" y="56" width="560" height="372" rx="8"/><text class="t tb tl" x="30" y="80">Section across a beam between two panels</text><rect class="a-REL" x="30" y="118" width="130" height="40"/><rect class="a-REL" x="235" y="118" width="130" height="40"/><rect class="f-COND" x="160" y="118" width="75" height="150" style="fill-opacity:.35;stroke:var(--ink);stroke-width:1.2"/><rect x="160" y="118" width="75" height="40" style="fill:url(#F05A-tex);stroke:var(--ink);stroke-width:.8"/><text class="t tx" x="95" y="109" text-anchor="middle">panel A (released)</text><text class="t tx" x="300" y="109" text-anchor="middle">panel B (released)</text><path class="lead" d="M160 94V278" style="stroke-dasharray:3 2"/><path class="lead" d="M235 94V278" style="stroke-dasharray:3 2"/><text class="t tx" x="197.5" y="294" text-anchor="middle">panel edges sit on the beam faces</text><path class="lead" d="M229 138L375 180"/><text class="t tx tb" x="379" y="184">strip B x t over the beam:</text><text class="t tx t2" x="379" y="198">in no panel; beam concrete</text><text class="t tx t2" x="379" y="212">under both readings</text><text class="t tx tb" x="379" y="240">beam below the slab:</text><text class="t tx t2" x="379" y="254">conditional (F04)</text><use href="#i-REL" x="30" y="320" width="11" height="11"/><text class="t tx" x="46" y="330">BO-01: 243 of 243 beam-supported panel edges lie on a drawn face</text><text class="t tx" x="46" y="345">(beam edge line: 217, column outline: 26)</text><use href="#i-REL" x="30" y="350" width="11" height="11"/><text class="t tx" x="46" y="360">BO-02: released panels overlapping a drawn column: 0 m2</text><use href="#i-REL" x="30" y="365" width="11" height="11"/><text class="t tx" x="46" y="375">BO-03: 143 beam lengths are clear lengths (never above c/c)</text><use href="#i-REL" x="30" y="380" width="11" height="11"/><text class="t tx" x="46" y="390">BO-05: per beam, B - A = B x t x L (116 beams): no slab counted twice</text><use href="#i-COND" x="30" y="395" width="11" height="11"/><text class="t tx" x="46" y="405">BO-04: 10 corner ends; at most 0.4539 m3 unowned under the larger reading (RFI-A10)</text><rect class="card" x="592" y="56" width="392" height="372" rx="8"/><text class="t tb tl" x="606" y="78">Plan: who owns the junction</text><text class="t tx tb" x="606" y="104">beam into a column</text><rect class="f-OWN" x="682" y="122" width="44" height="44" style="stroke:var(--ink2)"/><rect class="f-COND" x="622" y="133" width="60" height="22" style="fill-opacity:.6"/><rect class="f-COND" x="726" y="133" width="60" height="22" style="fill-opacity:.6"/><text class="t tx t2" x="802" y="130">the column owns its footprint</text><text class="t tx t2" x="802" y="143">for the storey; the beam stops</text><text class="t tx t2" x="802" y="156">at its face</text><text class="t tx tb" x="606" y="212">beam carried by a beam</text><rect class="f-COND" x="622" y="238" width="160" height="27.5" style="fill-opacity:.6"/><rect class="f-COND" x="690" y="265.5" width="22" height="44" style="fill-opacity:.35;stroke:var(--ink2);stroke-width:.6"/><text class="t tx t2" x="802" y="238">the carrier runs through; the</text><text class="t tx t2" x="802" y="251">carried beam stops at its face</text><text class="t tx tb" x="606" y="320">two beams, no column</text><rect class="f-COND" x="622" y="346" width="70" height="27.5" style="fill-opacity:.6"/><rect class="f-COND" x="692" y="373.5" width="27.5" height="44" style="fill-opacity:.35;stroke:var(--ink2);stroke-width:.6"/><rect x="692" y="346" width="27.5" height="27.5" style="fill:none;stroke:var(--crit);stroke-width:1.4;stroke-dasharray:2 1.5"/><text class="t tx t2" x="802" y="346">both stop at the other&#x27;s face:</text><text class="t tx t2" x="802" y="359">the corner square is in neither</text></svg>
