<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="484" viewBox="0 0 1000 484" role="img" aria-labelledby="F04A-t" data-figure="F04A"><title id="F04A-t">4  The two readings of the beam schedule depth H</title><style>:root{--surface:#fcfcfb;--card:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--rule:#cfcdc4;--plan:#6f6d66;--plan2:#aeaca4;--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--neutral:#c2c0b7;--slab:#e7e5dd;--s1:#2a78d6;--s2:#eb6834}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#1a1a19;--card:#232321;--ink:#f1f0eb;--ink2:#c4c2ba;--muted:#8f8d86;--grid:#353431;--rule:#4a4945;--plan:#a7a59d;--plan2:#6b6963;--neutral:#6a6863;--slab:#34332f;--s1:#3987e5;--s2:#d95926}}
:root[data-theme="dark"]{--surface:#1a1a19;--card:#232321;--ink:#f1f0eb;--ink2:#c4c2ba;--muted:#8f8d86;--grid:#353431;--rule:#4a4945;--plan:#a7a59d;--plan2:#6b6963;--neutral:#6a6863;--slab:#34332f;--s1:#3987e5;--s2:#d95926}
.t{font-family:system-ui,Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--ink);font-size:10.5px}.tt{font-size:15px;font-weight:650}.ts{font-size:11.5px;fill:var(--ink2)}.t2{fill:var(--ink2)}.tm{fill:var(--muted)}.tb{font-weight:650}.tx{font-size:9.5px}.tl{font-size:12.5px}.th{font-size:22px;font-weight:650}.ax{stroke:var(--grid);stroke-width:1;fill:none}.rule{stroke:var(--rule);stroke-width:1;fill:none}.pl{stroke:var(--plan);stroke-width:.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.pl2{stroke:var(--plan2);stroke-width:.55;fill:none;stroke-dasharray:3 2}.plb{stroke:var(--ink2);stroke-width:1;fill:none}.gl{stroke:var(--grid);stroke-width:.8;stroke-dasharray:2 3}.dim{stroke:var(--ink2);stroke-width:.8;fill:none}.lead{stroke:var(--ink2);stroke-width:.7;fill:none}.slab{fill:var(--slab);stroke:var(--plan);stroke-width:.8}.void{fill:none;stroke:var(--plan2);stroke-width:.6;stroke-dasharray:2 2}.col{fill:var(--neutral);stroke:var(--ink2);stroke-width:.5}.ring{stroke:var(--surface);stroke-width:1.5}.mm{fill:none;stroke:var(--serious);stroke-width:1.6;stroke-dasharray:2.5 1.5}.hl{stroke:var(--crit);stroke-width:.8}.band{fill:var(--crit);fill-opacity:.18;stroke:var(--crit);stroke-width:1.2}.callout{fill:none;stroke:var(--crit);stroke-width:1.2}.s1{fill:var(--s1)}.s2{fill:var(--s2)}.k1{stroke:var(--s1)}.k2{stroke:var(--s2)}.surf{fill:var(--surface)}.card{fill:var(--card);stroke:var(--rule);stroke-width:1}.bdg{fill:none;stroke:var(--ink2);stroke-width:1}.bdg-SCHEMATIC{stroke-dasharray:3 2}.bdg-CONDITIONAL{stroke:var(--warn);fill:var(--warn);fill-opacity:.16}.tex{fill:none;stroke:var(--ink);stroke-opacity:.45;stroke-width:.8}.f-REL{fill:var(--good)}.a-REL{fill:var(--good);fill-opacity:.26;stroke:var(--good);stroke-width:.8}.k-REL{stroke:var(--good)}.f-COND{fill:var(--warn)}.a-COND{fill:var(--warn);fill-opacity:.26;stroke:var(--warn);stroke-width:.8}.k-COND{stroke:var(--warn)}.f-CONF{fill:var(--serious)}.a-CONF{fill:var(--serious);fill-opacity:.26;stroke:var(--serious);stroke-width:.8}.k-CONF{stroke:var(--serious)}.f-BLK{fill:var(--crit)}.a-BLK{fill:var(--crit);fill-opacity:.26;stroke:var(--crit);stroke-width:.8}.k-BLK{stroke:var(--crit)}.f-OWN{fill:var(--neutral)}.a-OWN{fill:var(--neutral);fill-opacity:.26;stroke:var(--neutral);stroke-width:.8}.k-OWN{stroke:var(--neutral)}</style><defs><symbol id="i-REL" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5.5" style="fill:var(--good)"/><path d="M3.3 6.2 5.2 8.1 8.8 4.3" style="fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"/></symbol><symbol id="i-COND" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" style="fill:var(--surface);stroke:var(--warn);stroke-width:1.6"/><path d="M6 1A5 5 0 0 0 6 11Z" style="fill:var(--warn)"/></symbol><symbol id="i-CONF" viewBox="0 0 12 12"><path d="M6 .8 11.4 10.8H.6Z" style="fill:var(--serious)"/><path d="M6 4.3v3.3" style="stroke:#fff;stroke-width:1.5;stroke-linecap:round"/><circle cx="6" cy="9.2" r=".8" style="fill:#fff"/></symbol><symbol id="i-BLK" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5.5" style="fill:var(--crit)"/><path d="M3.9 3.9 8.1 8.1M8.1 3.9 3.9 8.1" style="stroke:#fff;stroke-width:1.6;stroke-linecap:round"/></symbol><symbol id="i-OWN" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" style="fill:none;stroke:var(--ink2);stroke-width:1.3"/><path d="M3.6 6h4.8" style="stroke:var(--ink2);stroke-width:1.5;stroke-linecap:round"/></symbol></defs><rect width="1000" height="484" style="fill:var(--surface)"/><text class="t tt" x="16" y="25">4  The two readings of the beam schedule depth H</text><text class="t ts" x="16" y="43">The drawings print H but not whether it includes the slab. Neither reading is chosen here.</text><g data-label="CONDITIONAL"><rect class="bdg bdg-CONDITIONAL" x="897.6" y="12" width="86.4" height="18" rx="9"/><text class="t tx tb" x="940.8" y="24.5" text-anchor="middle">CONDITIONAL</text></g><g data-label="SCHEMATIC"><rect class="bdg bdg-SCHEMATIC" x="818" y="12" width="73.6" height="18" rx="9"/><text class="t tx tb" x="854.8" y="24.5" text-anchor="middle">SCHEMATIC</text></g><rect class="card" x="16" y="56" width="476" height="392" rx="8"/><text class="t tb tl" x="30" y="80">Reading A: H is the overall depth (slab included)</text><text class="t tx t2" x="77" y="103">slab panel (stops at the beam face)</text><rect class="slab" x="77" y="112" width="84" height="48"/><rect class="slab" x="221" y="112" width="84" height="48"/><rect class="s1" x="161" y="112" width="60" height="48" style="fill-opacity:.5"/><rect class="s1" x="161" y="160" width="60" height="72" style="fill-opacity:.92"/><rect x="161" y="112" width="60" height="120" style="fill:none;stroke:var(--ink);stroke-width:1.2"/><path class="dim" d="M161 244H221M161 239V249M221 239V249"/><text class="t tx" x="191" y="261" text-anchor="middle">B = 200</text><path class="dim" d="M317 112V232M312 112H322M312 232H322"/><text class="t tx tb" x="325" y="172">H = 400</text><text class="t tx t2" x="325" y="186">(the schedule depth)</text><path class="dim" d="M65 112V160M60 112H70M60 160H70"/><text class="t tx" x="58" y="140" text-anchor="end">t = 160</text><text class="t tb" x="30" y="344">beam = B x H x L</text><text class="t " x="30" y="362">= 0.2 x 0.4 x L = 0.0800 m3 per metre</text><text class="t t2" x="30" y="380">CBO-GFRS-CB5-BL008#SPAN2 (L = 3.7 m): 0.2960 m3</text><text class="t tx t2" x="30" y="398">the strip B x t over the beam is beam concrete in both readings</text><text class="t tx tm" x="30" y="414">mm; section to scale</text><rect class="card" x="508" y="56" width="476" height="392" rx="8"/><text class="t tb tl" x="522" y="80">Reading B: H is measured below the slab</text><text class="t tx t2" x="569" y="103">slab panel (stops at the beam face)</text><rect class="slab" x="569" y="112" width="84" height="48"/><rect class="slab" x="713" y="112" width="84" height="48"/><rect class="s2" x="653" y="112" width="60" height="48" style="fill-opacity:.5"/><rect class="s2" x="653" y="160" width="60" height="120" style="fill-opacity:.92"/><rect x="653" y="112" width="60" height="168" style="fill:none;stroke:var(--ink);stroke-width:1.2"/><path class="dim" d="M653 292H713M653 287V297M713 287V297"/><text class="t tx" x="683" y="309" text-anchor="middle">B = 200</text><path class="dim" d="M809 112V280M804 112H814M804 280H814"/><text class="t tx tb" x="817" y="196">H + t = 560</text><text class="t tx t2" x="817" y="210">(H = 400 below the slab)</text><path class="dim" d="M557 112V160M552 112H562M552 160H562"/><text class="t tx" x="550" y="140" text-anchor="end">t = 160</text><text class="t tb" x="522" y="344">beam = B x H + t x L</text><text class="t " x="522" y="362">= 0.2 x 0.56 x L = 0.1120 m3 per metre</text><text class="t t2" x="522" y="380">CBO-GFRS-CB5-BL008#SPAN2 (L = 3.7 m): 0.4144 m3</text><text class="t tx t2" x="522" y="398">the strip B x t over the beam is beam concrete in both readings</text><text class="t tx tm" x="522" y="414">mm; section to scale</text><text class="t t2" x="16" y="470">Most common conditional section: B 200 x H 400 mm with t = 160 mm (34 of 102 beams). The readings differ by the strip B x t x L = 0.0320 m3 per metre; 0.1184 m3 for the example beam.</text></svg>
