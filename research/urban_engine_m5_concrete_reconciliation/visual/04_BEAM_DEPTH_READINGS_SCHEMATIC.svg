<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360"><rect width="980" height="360" fill="#fff"/><text x="30" y="24" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c;font-size:15px;font-weight:bold">4  Beam depth readings and the beam / slab overlap (SCHEMATIC)</text><text x="30" y="42" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c;fill:#4a5568">Not to scale. The four sources split the same concrete differently; only the frame per floor is allocation-free.</text><rect x="40" y="90" width="200" height="22" fill="#a0aec0" fill-opacity="0.5"/><rect x="115" y="90" width="50" height="88" fill="#2b6cb0" fill-opacity="0.6"/><rect x="40" y="90" width="75" height="22" fill="#2f855a" fill-opacity="0.45"/><rect x="165" y="90" width="75" height="22" fill="#2f855a" fill-opacity="0.45"/><text x="40" y="230" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c;font-weight:bold">Freelancer</text><text x="40" y="246" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c;font-size:10px;fill:#4a5568">beam gross depth H (slab inside), slab net</text><rect x="275" y="90" width="200" height="22" fill="#a0aec0" fill-opacity="0.5"/><rect x="350" y="90" width="50" height="88" fill="#2b6cb0" fill-opacity="0.6"/><rect x="275" y="90" width="75" height="22" fill="#2f855a" fill-opacity="0.45"/><rect x="400" y="90" width="75" height="22" fill="#2f855a" fill-opacity="0.45"/><text x="275" y="230" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c;font-weight:bold">Urban base (reading A)</text><text x="275" y="246" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c;font-size:10px;fill:#4a5568">H overall incl. slab; panels stop at faces</text><rect x="510" y="90" width="200" height="22" fill="#a0aec0" fill-opacity="0.5"/><rect x="585" y="90" width="50" height="110" fill="#2b6cb0" fill-opacity="0.6"/><rect x="510" y="90" width="75" height="22" fill="#2f855a" fill-opacity="0.45"/><rect x="635" y="90" width="75" height="22" fill="#2f855a" fill-opacity="0.45"/><text x="510" y="230" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c;font-weight:bold">Urban high (reading B)</text><text x="510" y="246" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c;font-size:10px;fill:#4a5568">H below the slab: + t over every beam</text><rect x="745" y="90" width="200" height="22" fill="#a0aec0" fill-opacity="0.5"/><rect x="745" y="90" width="200" height="22" fill="#2f855a" fill-opacity="0.45"/><rect x="820" y="112" width="50" height="66" fill="#2b6cb0" fill-opacity="0.6"/><text x="745" y="230" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c;font-weight:bold">MCP (U-C4N, christiannp)</text><text x="745" y="246" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c;font-size:10px;fill:#4a5568">downstand only; slab full depth over beams</text><text x="40" y="290" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c">Freelancer beams + slabs: 125.78 m3</text><text x="350" y="290" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c">Urban beams + slabs (base): 125.50 m3</text><text x="660" y="290" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c">Urban beams (reading B) + slabs: 141.75 m3</text><text x="40" y="308" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c">U-C4N beams + slabs: 146.53 m3</text><text x="350" y="308" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c">christiannp beams + slabs: 143.34 m3</text><rect x="40" y="338" width="14" height="10" fill="#2b6cb0" fill-opacity="0.6"/><text x="60" y="347" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#1a202c;font-size:10px">beam concrete</text><rect x="170" y="338" width="14" height="10" fill="#2f855a" fill-opacity="0.45"/><text x="