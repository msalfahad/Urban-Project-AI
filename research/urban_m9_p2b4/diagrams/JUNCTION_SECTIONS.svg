<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#666" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="900" height="360" fill="#ffffff"/><text x="40.0" y="30.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">A  SEPARATE_UPSTAND: floor sheet + band strip folded at the junction</text><rect x="340.0" y="60.0" width="60.0" height="230.0" fill="#cccccc" fill-opacity="1.0" stroke="#222222" stroke-width="1" /><rect x="40.0" y="250.0" width="300.0" height="40.0" fill="#cccccc" fill-opacity="1.0" stroke="#222222" stroke-width="1" /><text x="370.0" y="314.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal">wall</text><text x="190.0" y="314.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal">floor</text><rect x="40.0" y="244.0" width="300.0" height="6.0" fill="#6fa8dc" fill-opacity="1.0" stroke="#222222" stroke-width="0.8" /><rect x="334.0" y="170.0" width="6.0" height="80.0" fill="#e69138" fill-opacity="1.0" stroke="#222222" stroke-width="0.8" /><rect x="240.0" y="238.0" width="100.0" height="6.0" fill="#e69138" fill-opacity="1.0" stroke="#222222" stroke-width="0.8" /><text x="290.0" y="230.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222" text-anchor="middle" font-weight="normal">flange j on the floor sheet</text><text x="330.0" y="165.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222" text-anchor="end" font-weight="normal">h = 0.20</text><text x="50.0" y="236.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">floor sheet stops at the wall</text><text x="40.0" y="340.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">junction lap = j: a product value (V2.5 uses 0.10, the UP-WP-002 joint lap); a fillet or</text><text x="40.0" y="354.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">reinforcing strip, if the system needs one, is not included</text><text x="480.0" y="30.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">B  CONTINUOUS_FOLD: the floor sheet turned up the wall</text><rect x="780.0" y="60.0" width="60.0" height="230.0" fill="#cccccc" fill-opacity="1.0" stroke="#222222" stroke-width="1" /><rect x="480.0" y="250.0" width="300.0" height="40.0" fill="#cccccc" fill-opacity="1.0" stroke="#222222" stroke-width="1" /><text x="810.0" y="314.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal">wall</text><text x="630.0" y="314.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal">floor</text><rect x="480.0" y="244.0" width="300.0" height="6.0" fill="#6fa8dc" fill-opacity="1.0" stroke="#222222" stroke-width="0.8" /><rect x="774.0" y="170.0" width="6.0" height="80.0" fill="#6fa8dc" fill-opacity="1.0" stroke="#222222" stroke-width="0.8" /><text x="770.0" y="165.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222" text-anchor="end" font-weight="normal">h = 0.20</text><text x="490.0" y="236.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">one sheet, folded at the junction</text><text x="480.0" y="340.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">no junction lap; needs a sheet that may be folded 90 degrees, and a</text><text x="480.0" y="354.0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">corner detail for the excess at every internal corner</text></svg>
